{% extends "base.html" %}

{% block title %}Check your email — messenger{% endblock %}

{% block content %}
<div class="auth-page">
  <section class="panel auth-panel">
    <h1 class="page-title">Check your email</h1>
    <p class="lead">Account created. We sent a confirmation link to your email. You can sign in after you open that link.</p>

    <form method="post" action="{% url 'resend-confirmation' %}" class="stack-form auth-form">
      {% csrf_token %}
      <div class="auth-field">
        <label class="auth-field__label" for="id_resend_email">Email</label>
        <input id="id_resend_email" class="ui-input" type="email" name="email" placeholder="name@example.com" autocomplete="email" inputmode="email" spellcheck="false" required>
      </div>
      <div class="auth-form__actions">
        <button type="submit" class="btn btn--primary btn--block auth-submit">Send the link again</button>
      </div>
    </form>

    <p class="footnote">
      Already confirmed? <a href="{% url 'login' %}">Sign in</a>
    </p>
  </section>
</div>
{% endblock %}
