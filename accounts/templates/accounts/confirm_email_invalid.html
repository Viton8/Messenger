{% extends "base.html" %}

{% block title %}Confirmation link — messenger{% endblock %}

{% block content %}
<div class="auth-page">
  <section class="panel auth-panel">
    <h1 class="page-title">Link not valid</h1>
    <p class="lead">This confirmation link is invalid or has expired. Request another one and open the newest email.</p>
    <p class="footnote">
      <a href="{% url 'register-done' %}">Send the link again</a>
    </p>
  </section>
</div>
{% endblock %}
