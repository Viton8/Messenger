{% for field in form %}
<div class="stack-form__full">
  {% if field.field.widget.input_type == 'checkbox' %}
  <label class="stack-form__check" for="{{ field.id_for_label }}">{{ field }} <span>{{ field.label }}</span></label>
  {% else %}
  <label class="stack-form__label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% endif %}
  {% for error in field.errors %}
  <p class="field-error" role="alert"><span class="field-error__icon" aria-hidden="true">⚠</span> <span>{{ error }}</span></p>
  {% endfor %}
  {% if field.help_text %}
  <p class="field-hint" id="{{ field.auto_id }}-hint">{{ field.help_text }}</p>
  {% endif %}
</div>
{% endfor %}
